name: Build Changsheng Car Launcher v5 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Fixed Signing Key
        run: |
          mkdir -p ~/.android
          cat << 'EOF' | base64 -d > ~/.android/debug.keystore
          
          EOF
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChangshengCarLauncher-v5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
